<!DOCTYPE html>
<html>
<head>
    <title>Bill Details</title>
</head>
<body>

<a href="index.html">Customers</a>

<h1>Bill Details</h1>

<section>
    <h2>Bill</h2>

    <p>Bill ID: <span id="billId"></span></p>
    <p>Total: <span id="billTotal"></span></p>
    <p>Paid: <span id="paidAmount"></span></p>
    <p>Remaining: <span id="remainingAmount"></span></p>
    <p>Due Date: <span id="dueDate"></span></p>
    <p>Status: <span id="billStatus"></span></p>
</section>

<hr>

<section>
    <h2>Payment History</h2>

    <table border="1">
        <thead>
            <tr>
                <th>Payment ID</th>
                <th>Date</th>
                <th>Amount</th>
                <th>Method</th>
            </tr>
        </thead>

        <tbody id="paymentTable">
        </tbody>
    </table>
</section>

<hr>

<section>
    <h2>Pay Bill</h2>

    <form id="paymentForm">

        <label>Amount:</label>
        <input type="number" id="paymentAmount">

        <label>Payment Method:</label>
        <select id="paymentMethod">
            <option>Credit Card</option>
            <option>Bank Transfer</option>
            <option>Cash</option>
        </select>

        <button type="submit">Pay</button>
    </form>
</section>

    <script src="bill.js"></script>
</body>
</html>
