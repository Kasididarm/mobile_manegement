<!DOCTYPE html>
<html>

<head>
    <title>Customer Details</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <a href="index.html">Back to Customers</a>

    <h1>Customer Details</h1>

    <section>
        <h2>Customer</h2>

        <p>ID: <span id="customerId"></span></p>
        <p>Name: <span id="customerName"></span></p>
        <p>Email: <span id="customerEmail"></span></p>
        <p>Status: <span id="customerStatus"></span></p>
    </section>

    <hr>

    <section>
        <h2>Mobile Numbers</h2>

        <table border="1">
            <thead>
                <tr>
                    <th>Phone Number</th>
                    <th>Activation Date</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="mobileTable">
            </tbody>
        </table>
    </section>

    <hr>

    <section>
        <h2>Bills</h2>

        <table border="1">
            <thead>
                <tr>
                    <th>Bill ID</th>
                    <th>Billing Period</th>
                    <th>Total</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="billTable">
            </tbody>
        </table>
    </section>

    <h3>Add Mobile Number</h3>

    <form id="mobileForm">
        <input type="text" id="newPhoneNumber" placeholder="Phone number" required>

        <input type="date" id="activationDate" required>

        <select id="mobileStatus">
            <option value="Active">Active</option>
            <option value="Inactive">Inactive</option>
        </select>

        <button type="submit">Add Mobile Number</button>
    </form>

    <script src="customer.js"></script>
</body>

</html>
